<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساري | حجز المستشفيات والرعاية الصحية</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="stylesheet" href="css/responsive.css?v=4">
  <link rel="icon" type="image/svg+xml" href="assets/logo/masari-logo.svg">
</head>
<body>

  <!-- Top Device Toolbar -->
  <header class="device-toolbar">
    <div class="toolbar-brand">
      <strong>مساري | Masari</strong>
      <span>حجز المستشفيات (Hospitals)</span>
    </div>

    <div class="toolbar-modes">
      <button class="mode-btn active" id="btnViewMobile">عرض الجوال</button>
      <button class="mode-btn" id="btnViewDesktop">الشاشة الموسعة</button>
    </div>

    <div>
      <select class="quick-nav-select" id="quickPageSelect">
        <option value="index.html">1. واجهة البداية (Welcome)</option>
        <option value="login.html">2. تسجيل الدخول (Login)</option>
        <option value="register.html">3. إنشاء حساب (Register)</option>
        <option value="home.html">4. الصفحة الرئيسية (Home)</option>
        <option value="flights.html">5. البحث عن رحلات (Flights)</option>
        <option value="flight-details.html">6. تفاصيل الرحلة (Flight Details)</option>
        <option value="hotels.html">7. الفنادق (Hotels)</option>
        <option value="hospitals.html" selected>8. المستشفيات (Hospitals)</option>
        <option value="bookings.html">9. سجل الحجوزات (Bookings)</option>
        <option value="payment.html">10. الدفع (Payment)</option>
        <option value="confirmation.html">11. تأكيد الحجز (Confirmation)</option>
      </select>
    </div>
  </header>

  <!-- Sliding Sidebar Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop">
    <div class="side-drawer">
      <div class="drawer-header">
        <div class="drawer-user-info">
          <div class="drawer-avatar" id="drawerUserAvatar">ن</div>
          <div>
            <div style="font-weight: 800; font-size: 16px;" id="drawerUserName">ندى القاضي</div>
            <div style="font-size: 12px; opacity: 0.85;">عضو بلاتيني</div>
          </div>
        </div>
        <button class="drawer-close-btn" id="closeDrawerBtn" title="إغلاق">✕</button>
      </div>

      <nav class="drawer-nav">
        <a href="home.html">الرئيسية</a>
        <a href="flights.html">الرحلات الجوية</a>
        <a href="hotels.html">الفنادق والمنتجعات</a>
        <a href="hospitals.html" class="active">المستشفيات والرعاية الصحية</a>
        <a href="bookings.html">سجل الحجوزات</a>
      </nav>

      <div class="drawer-footer">
        <button class="logout-btn" id="drawerLogoutBtn">تسجيل الخروج</button>
      </div>
    </div>
  </div>

  <main class="app-viewport">
    <div class="app-screen" id="appScreen">
      <!-- Notch Bar -->
      <div class="phone-notch-bar">
        <span id="notchTime">9:41</span>
        <div class="notch-icons">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.66-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="9" width="10" height="6" fill="currentColor"/><path d="M20 11v2"/></svg>
        </div>
      </div>

      <!-- App Header matching mockup -->
      <div class="app-header">
        <a href="home.html" class="header-btn">
          <span>&larr;</span>
          <span>رجوع</span>
        </a>

        <div class="header-title-logo">
          <img src="assets/logo/masari-logo.svg" alt="مساري" style="height: 38px;">
        </div>

        <button class="header-btn icon-only" id="openDrawerBtn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>

      <div class="screen-body">
        <!-- Hospitals Hero Header matching mockup -->
        <div class="section-banner-header">
          <img src="assets/images/hospital-building.jpg" alt="مستشفيات ورعاية صحية">
          <div class="overlay-info">
            <h2>للمستشفيات</h2>
            <p>رعاية صحية بأعلى جودة واستشارات طبية متخصصة</p>
          </div>
        </div>

        <!-- Search Bar matching mockup -->
        <div class="search-bar-wrapper">
          <div class="input-container">
            <input type="text" id="hospitalSearchInput" class="search-input-box" placeholder="البحث عن مستشفى...">
            <div class="input-icon-right">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
          </div>
        </div>

        <!-- Hospitals Listing matching mockup -->
        <div class="items-listing-container" id="hospitalsListContainer">
          <!-- Populated by script -->
        </div>
      </div>

      <!-- Bottom Nav -->
      <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>الرئيسية</span>
        </a>
        <a href="bookings.html" class="nav-item">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>حجوزاتي</span>
        </a>
        <a href="javascript:void(0)" class="nav-item" onclick="document.getElementById('drawerBackdrop').classList.add('open')">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>الملف الشخصي</span>
        </a>
      </nav>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('hospitalsListContainer');
      const searchInput = document.getElementById('hospitalSearchInput');
      const hospitals = JSON.parse(localStorage.getItem('masari_hospitals')) || [];

      function render(items) {
        if (!container) return;
        container.innerHTML = '';
        if (items.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 30px;">لم يتم العثور على مستشفيات مطابقة للبحث</div>';
          return;
        }

        items.forEach(h => {
          const card = document.createElement('div');
          card.className = 'catalog-card';
          card.innerHTML = `
            <img src="${h.image}" alt="${h.name}" class="catalog-thumbnail">
            <div class="catalog-details">
              <div class="catalog-title">${h.name}</div>
              <div class="catalog-subtitle">${h.location}</div>
              <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px; line-height: 1.3;">${h.summary.substring(0, 60)}...</div>
              <div class="catalog-meta-row">
                <div class="star-rating">
                  <span>${h.rating}</span>
                  <span>★</span>
                </div>
                <div class="item-price">
                  <span>SAR ${h.consultationFee}</span>
                  <small>/ كشفية</small>
                </div>
              </div>
            </div>
          `;

          card.addEventListener('click', () => {
            const pending = {
              type: 'hospital',
              title: h.name,
              details: `حجز موعد كشف واستشارة في ${h.name}`,
              date: '16 ديسمبر 2025',
              price: h.consultationFee,
              currency: 'SAR',
              rating: h.rating
            };
            localStorage.setItem('masari_pending_booking', JSON.stringify(pending));
            window.location.href = 'payment.html';
          });

          container.appendChild(card);
        });
      }

      render(hospitals);

      searchInput?.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = hospitals.filter(h => h.name.toLowerCase().includes(query) || h.location.toLowerCase().includes(query) || h.summary.toLowerCase().includes(query));
        render(filtered);
      });
    });
  </script>
</body>
</html>
