<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساري | إنشاء حساب جديد</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo/masari-logo.svg">
</head>
<body>

  <!-- Top Device & Navigation Toolbar -->
  <header class="device-toolbar">
    <div class="toolbar-brand">
      <strong>مساري | Masari</strong>
      <span>إنشاء حساب جديد (Register)</span>
    </div>

    <div class="toolbar-modes">
      <button class="mode-btn active" id="btnViewMobile">عرض الجوال</button>
      <button class="mode-btn" id="btnViewDesktop">الشاشة الموسعة</button>
    </div>

    <div>
      <select class="quick-nav-select" id="quickPageSelect">
        <option value="index.html">1. واجهة البداية (Welcome)</option>
        <option value="login.html">2. تسجيل الدخول (Login)</option>
        <option value="register.html" selected>3. إنشاء حساب (Register)</option>
        <option value="home.html">4. الصفحة الرئيسية (Home)</option>
        <option value="flights.html">5. البحث عن رحلات (Flights)</option>
        <option value="flight-details.html">6. تفاصيل الرحلة (Flight Details)</option>
        <option value="hotels.html">7. الفنادق (Hotels)</option>
        <option value="hospitals.html">8. المستشفيات (Hospitals)</option>
        <option value="bookings.html">9. سجل الحجوزات (Bookings)</option>
        <option value="payment.html">10. الدفع (Payment)</option>
        <option value="confirmation.html">11. تأكيد الحجز (Confirmation)</option>
      </select>
    </div>
  </header>

  <main class="app-viewport">
    <div class="app-screen" id="appScreen">
      <!-- Notch Bar -->
      <div class="phone-notch-bar">
        <span id="notchTime">9:41</span>
        <div class="notch-icons">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.66-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="9" width="10" height="6" fill="currentColor"/><path d="M20 11v2"/></svg>
        </div>
      </div>

      <div class="screen-body no-bottom-nav">
        <!-- Auth Header with airplane accent matching mockup -->
        <div class="auth-header-card" style="padding-top: 18px; padding-bottom: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px 10px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2">
              <path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/>
            </svg>
            <img src="assets/logo/masari-logo.svg" alt="مساري" style="height: 44px;">
            <span style="width: 24px;"></span>
          </div>
          <h1 class="auth-title">إنشاء حساب جديد</h1>
          <p class="auth-subtitle">للبدء في رحلتك معنا</p>
        </div>

        <!-- Registration Form -->
        <div class="auth-body-card">
          <form id="registerForm" novalidate>
            <!-- Full Name -->
            <div class="form-group" id="nameGroup">
              <label class="form-label" for="regName">الاسم الكامل</label>
              <div class="input-container">
                <input type="text" id="regName" class="input-field" placeholder="مثال: ندى القاضي" required>
                <div class="input-icon-right">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
              </div>
              <div class="field-error">يرجى كتابة الاسم الكامل</div>
            </div>

            <!-- Email -->
            <div class="form-group" id="emailGroup">
              <label class="form-label" for="regEmail">البريد الإلكتروني</label>
              <div class="input-container">
                <input type="email" id="regEmail" class="input-field" placeholder="name@domain.com" required>
                <div class="input-icon-right">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
              </div>
              <div class="field-error">يرجى إدخال بريد إلكتروني صالح</div>
            </div>

            <!-- Phone Number -->
            <div class="form-group" id="phoneGroup">
              <label class="form-label" for="regPhone">رقم الجوال</label>
              <div class="input-container">
                <input type="tel" id="regPhone" class="input-field" placeholder="05XXXXXXXX" required>
                <div class="input-icon-right">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </div>
              </div>
              <div class="field-error">يرجى إدخال رقم جوال صحيح</div>
            </div>

            <!-- Password -->
            <div class="form-group" id="passwordGroup">
              <label class="form-label" for="regPassword">كلمة المرور</label>
              <div class="input-container">
                <input type="password" id="regPassword" class="input-field" placeholder="••••••••" required>
                <div class="input-icon-right">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <div class="input-icon-left password-toggle-btn">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>
              </div>
              <div class="field-error">كلمة المرور يجب ألا تقل عن 6 خانات</div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group" id="confirmPasswordGroup">
              <label class="form-label" for="regConfirmPassword">تأكيد كلمة المرور</label>
              <div class="input-container">
                <input type="password" id="regConfirmPassword" class="input-field" placeholder="••••••••" required>
                <div class="input-icon-right">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
              </div>
              <div class="field-error">كلمتا المرور غير متطابقتين</div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary" style="margin-top: 10px;">
              إنشاء حساب
            </button>
          </form>

          <!-- Link to Login -->
          <div class="auth-footer-prompt">
            لديك حساب بالفعل؟
            <a href="login.html">تسجيل الدخول</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
