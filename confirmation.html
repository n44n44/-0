<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساري | تم تأكيد الحجز بنجاح</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/responsive.css?v=3">
  <link rel="icon" type="image/svg+xml" href="assets/logo/masari-logo.svg">
</head>
<body>

  <!-- Top Device Toolbar -->
  <header class="device-toolbar">
    <div class="toolbar-brand">
      <strong>مساري | Masari</strong>
      <span>تأكيد الحجز (Confirmation)</span>
    </div>

    <div class="toolbar-modes">
      <button class="mode-btn active" id="btnViewMobile">عرض الجوال</button>
      <button class="mode-btn" id="btnViewDesktop">الشاشة الموسعة</button>
    </div>

    <div>
      <select class="quick-nav-select" id="quickPageSelect">
        <option value="index.html">1. واجهة البداية (Welcome)</option>
        <option value="login.html">2. تسجيل الدخول (Login)</option>
        <option value="register.html">3. إنشاء حساب (Register)</option>
        <option value="home.html">4. الصفحة الرئيسية (Home)</option>
        <option value="flights.html">5. البحث عن رحلات (Flights)</option>
        <option value="flight-details.html">6. تفاصيل الرحلة (Flight Details)</option>
        <option value="hotels.html">7. الفنادق (Hotels)</option>
        <option value="hospitals.html">8. المستشفيات (Hospitals)</option>
        <option value="bookings.html">9. سجل الحجوزات (Bookings)</option>
        <option value="payment.html">10. الدفع (Payment)</option>
        <option value="confirmation.html" selected>11. تأكيد الحجز (Confirmation)</option>
      </select>
    </div>
  </header>

  <main class="app-viewport">
    <div class="app-screen" id="appScreen">
      <!-- Notch Bar -->
      <div class="phone-notch-bar">
        <span id="notchTime">9:41</span>
        <div class="notch-icons">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.66-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="9" width="10" height="6" fill="currentColor"/><path d="M20 11v2"/></svg>
        </div>
      </div>

      <!-- App Header Bar -->
      <div class="app-header">
        <div style="width: 32px;"></div>
        <div class="header-title-logo">
          <img src="assets/logo/masari-logo.svg" alt="مساري" style="height: 38px;">
        </div>
        <div style="width: 32px;"></div>
      </div>

      <div class="screen-body no-bottom-nav">
        <!-- Confirmation Content matching mockup -->
        <div class="confirmation-container">
          <!-- Green Success Circle Checkmark matching mockup -->
          <div class="success-badge-circle">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>

          <h1 class="confirmation-title">تم تأكيد الحجز بنجاح ! 🎉</h1>
          
          <div class="booking-ref-number" id="confirmationBookingRef">
            #MS123456
          </div>

          <p class="confirmation-message">
            شكراً لاختيارك مساري، نتمنى لك رحلة سعيدة وتجربة استثنائية!
          </p>

          <!-- Airport Runway Wide Banner matching bottom banner in mockup -->
          <img src="assets/images/plane-runway.jpg" alt="مدرج المطار ومساري" class="confirmation-banner-img">

          <!-- Confirmed Summary Box -->
          <div class="confirmation-card-summary">
            <div style="font-weight: 800; font-size: 14px; margin-bottom: 8px; color: var(--primary);" id="confirmedItemTitle">
              رحلة الرياض - دبي (طيران السعودية)
            </div>
            <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;" id="confirmedItemDate">
              التاريخ: 29 ديسمبر 2025
            </div>
            <div style="font-size: 13px; color: var(--text-secondary);" id="confirmedItemPrice">
              المبلغ المدفوع: SAR 1,250 (مؤكد ومسدد)
            </div>
          </div>

          <!-- Actions matching mockup -->
          <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
            <a href="home.html" class="btn-primary" style="background: var(--primary);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span>العودة إلى الرئيسية</span>
            </a>

            <a href="bookings.html" class="btn-primary" style="background: #ffffff; color: var(--primary); border: 1.5px solid var(--border-light); box-shadow: none;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
              <span>عرض في سجل الحجوزات</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check query parameter or last confirmed booking
      const urlParams = new URLSearchParams(window.location.search);
      const refFromUrl = urlParams.get('ref');

      const elRef = document.getElementById('confirmationBookingRef');
      const elTitle = document.getElementById('confirmedItemTitle');
      const elDate = document.getElementById('confirmedItemDate');
      const elPrice = document.getElementById('confirmedItemPrice');

      const lastConfirmedStr = localStorage.getItem('masari_last_confirmed');
      if (lastConfirmedStr) {
        try {
          const item = JSON.parse(lastConfirmedStr);
          if (elRef) elRef.textContent = `#${item.id || refFromUrl || 'MS123456'}`;
          if (elTitle) elTitle.textContent = item.title || 'رحلة الرياض - دبي';
          if (elDate) elDate.textContent = `التاريخ: ${item.date || '29 ديسمبر 2025'}`;
          if (elPrice) elPrice.textContent = `المبلغ المدفوع: SAR ${item.price?.toLocaleString() || '1,250'} (مؤكد ومسدد)`;
        } catch (e) {
          console.error(e);
        }
      } else if (refFromUrl && elRef) {
        elRef.textContent = `#${refFromUrl}`;
      }
    });
  </script>
</body>
</html>
