<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساري | Masari - رحلتك أسهل معنا</title>
  <link rel="stylesheet" href="css/style.css?v=6">
  <link rel="stylesheet" href="css/responsive.css?v=6">
  <link rel="icon" type="image/svg+xml" href="assets/logo/masari-logo.svg">
</head>
<body>

  <!-- Top Device Toolbar (Single row on mobile & desktop) -->
  <header class="device-toolbar">
    <div class="toolbar-brand">
      <strong>مساري | Masari</strong>
      <span>واجهة البداية (Welcome)</span>
    </div>

    <div class="toolbar-modes">
      <button class="mode-btn active" id="btnViewMobile" title="عرض شاشة الجوال">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="3"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
        عرض الجوال
      </button>
      <button class="mode-btn" id="btnViewDesktop" title="عرض الشاشة الكاملة">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        الشاشة الموسعة
      </button>
    </div>

    <div>
      <select class="quick-nav-select" id="quickPageSelect">
        <option value="index.html" selected>1. واجهة البداية (Welcome)</option>
        <option value="login.html">2. تسجيل الدخول (Login)</option>
        <option value="register.html">3. إنشاء حساب (Register)</option>
        <option value="home.html">4. الصفحة الرئيسية (Home)</option>
        <option value="flights.html">5. البحث عن رحلات (Flights)</option>
        <option value="flight-details.html">6. تفاصيل الرحلة (Flight Details)</option>
        <option value="hotels.html">7. الفنادق (Hotels)</option>
        <option value="hospitals.html">8. المستشفيات (Hospitals)</option>
        <option value="bookings.html">9. سجل الحجوزات (Bookings)</option>
        <option value="payment.html">10. الدفع (Payment)</option>
        <option value="confirmation.html">11. تأكيد الحجز (Confirmation)</option>
      </select>
    </div>
  </header>

  <main class="app-viewport">
    <div class="app-screen" id="appScreen">
      <!-- Status Notch Bar on Dark Teal -->
      <div class="phone-notch-bar on-dark">
        <span id="notchTime">10:55</span>
        <div class="notch-icons">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.66-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="16" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="9" width="10" height="6" fill="currentColor"/><path d="M20 11v2"/></svg>
        </div>
      </div>

      <!-- Welcome Screen Content matching Image 2 (media_1794919708062_7abc3bd8.jpg) -->
      <div class="welcome-v2-container">
        <!-- Top Bar with Language Pill -->
        <div class="welcome-v2-top-bar">
          <button type="button" class="welcome-lang-btn" onclick="MasariApp.toast('اللغة العربية هي اللغة الافتراضية للتطبيق', 'info')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span>اللغة</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>

        <!-- Brand Area: Logo, Slogan, and Trajectory -->
        <div class="welcome-v2-brand-area">
          <!-- Stylized Masari Logo with airplane arc -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 85" fill="none" class="welcome-v2-logo-svg">
            <!-- Trajectory arc -->
            <path d="M 25 70 C 15 35, 60 12, 165 14" stroke="#8ce4ce" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />
            <path d="M 40 74 C 30 45, 70 22, 160 22" stroke="#8ce4ce" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4" />
            
            <!-- Airplane icon taking off -->
            <g transform="translate(172, 8) rotate(32) scale(0.95)">
              <path d="M12 2L15 9L22 11L15 14L14 21L12 16L10 21L9 14L2 11L9 9Z" fill="#8ce4ce" />
            </g>

            <!-- Modern Arabic Typography "مساري" -->
            <text x="110" y="65" text-anchor="middle" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="42" fill="#cbeae2" letter-spacing="1">مساري</text>
          </svg>

          <!-- Divider: ابدأ رحلتك من هنا -->
          <div class="welcome-v2-step-label">
            <span>ابدأ رحلتك من هنا</span>
          </div>

          <!-- Main Heading: رحلتك.. أسهل معنا -->
          <h1 class="welcome-v2-main-heading">
            رحلتك.. <span class="highlight-mint">أسهل</span> معنا
          </h1>

          <!-- Sub Heading: كل وجهة تبدأ بخطوة -->
          <div class="welcome-v2-sub-heading">
            كل وجهة تبدأ بخطوة
          </div>
        </div>

        <!-- Airplane in flight center stage -->
        <div class="welcome-v2-plane-stage">
          <img src="assets/images/exact-welcome-plane.jpg" alt="طائرة مساري في السحب" style="max-height: 130px; object-fit: contain; width: 90%;">
        </div>

        <!-- Bottom Action Cards & Button matching Image 2 -->
        <div>
          <!-- Two Glass Action Cards: تسجيل الدخول / انشاء حساب جديد -->
          <div class="welcome-v2-auth-grid">
            <!-- تسجيل الدخول -->
            <a href="login.html" class="welcome-v2-glass-card">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
              <span>تسجيل الدخول</span>
            </a>

            <!-- انشاء حساب جديد -->
            <a href="register.html" class="welcome-v2-glass-card">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
              <span>انشاء حساب جديد</span>
            </a>
          </div>

          <!-- Main Sage Action Button: ابدأ .. ← -->
          <a href="home.html" class="welcome-v2-cta-btn">
            <span class="arrow-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </span>
            <span>ابدأ ..</span>
          </a>

          <!-- World Landmarks Silhouette Footer & Dots matching Image 2 -->
          <div class="welcome-v2-skyline-footer">
            <svg class="welcome-v2-silhouette-svg" viewBox="0 0 400 60" fill="currentColor">
              <!-- Eiffel tower, Ferris wheel, Big Ben, Terminal tower vector silhouette -->
              <path d="M10,60 L15,35 L20,35 L25,60 Z M50,60 L50,45 L60,40 L70,45 L70,60 Z M100,60 C100,45 115,35 130,35 C145,35 160,45 160,60 Z M190,60 L195,20 L200,10 L205,20 L210,60 Z M250,60 L250,30 L255,25 L260,30 L260,60 Z M300,60 C300,50 310,40 325,40 C340,40 350,50 350,60 Z M370,60 L375,35 L380,35 L385,60 Z"/>
            </svg>

            <!-- Dots Pagination -->
            <div class="welcome-v2-dots-row">
              <span class="dot-pill"></span>
              <span class="dot-circle"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
